apiVersion: apps/v1
kind: Deployment
metadata:
  name: java-kubernetes-lab
  namespace: education
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: java-kubernetes-lab
  template:
    metadata:
      labels:
        app: java-kubernetes-lab
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: java
          image: education-kubernetes-lab:dev
          imagePullPolicy: IfNotPresent # only for local kind loading; production uses immutable digest
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_GREETING
              valueFrom:
                configMapKeyRef:
                  name: java-kubernetes-config
                  key: APP_GREETING
            - name: JDK_JAVA_OPTIONS
              valueFrom:
                configMapKeyRef:
                  name: java-kubernetes-config
                  key: JDK_JAVA_OPTIONS
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: '1'
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            failureThreshold: 30
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              sleep:
                seconds: 5 # needs Kubernetes >=1.34; counts toward 35s termination budget
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            sizeLimit: 64Mi
