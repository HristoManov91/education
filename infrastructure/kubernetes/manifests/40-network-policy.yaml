# OPTIONAL educational example, not applied by the default smoke script.
# Requires a NetworkPolicy-capable CNI (standard kind networking does not enforce it).
# This policy is deliberately NOT a complete production policy: add DNS + approved egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: java-kubernetes-ingress
  namespace: education
spec:
  podSelector:
    matchLabels:
      app: java-kubernetes-lab
  policyTypes: [Ingress]
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
