server.port=8080
spring.application.name=loom-bank-api

# Основният Spring Boot switch за тази лаборатория.
# Когато е включен, поддържаните Spring executors/server components използват virtual threads,
# вместо класически platform-thread pools. Така можем да запазим blocking MVC/RestClient стил.
spring.threads.virtual.enabled=true

# Virtual threads са daemon threads. Daemon threads сами по себе си не държат JVM жива.
# Keep-alive настройката предотвратява приключване на приложението, когато execution-ът е
# основно върху virtual daemon threads.
spring.main.keep-alive=true

# Dummy downstream Spring Boot приложение от модула bank-services.
# То има нарочно добавена latency, за да се вижда concurrent fan-out поведението.
bank-services.base-url=http://localhost:8081
