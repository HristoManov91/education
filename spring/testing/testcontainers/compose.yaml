services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: education
      POSTGRES_USER: education
      POSTGRES_PASSWORD: education
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U education -d education"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.10.2
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
