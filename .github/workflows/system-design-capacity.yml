name: System Design Capacity Lab

on:
  push:
    branches: [main]
    paths:
      - "system-design/**"
      - ".github/workflows/system-design-capacity.yml"
  pull_request:
    paths:
      - "system-design/**"
      - ".github/workflows/system-design-capacity.yml"

jobs:
  capacity-and-overload-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
          cache-dependency-path: system-design/capacity-lab/pom.xml

      - name: Test System Design capacity lab
        run: mvn -B --no-transfer-progress -f system-design/capacity-lab/pom.xml test
