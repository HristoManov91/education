name: Ask the Architects — JPMS and Upgrade Java 25

on:
  pull_request:
    paths:
      - 'java/jvm/jpms-encapsulation/**'
      - 'java/jvm/jdk-upgrade-tooling/**'
      - 'java/jvm/native-interoperability/**'
      - 'java/concurrency/project-loom/**'
      - '.github/workflows/ask-architects-jpms-upgrade.yml'
  workflow_dispatch:

jobs:
  architects-java25:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25 LTS
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: JPMS module-path positive and negative access checks
        run: bash java/jvm/jpms-encapsulation/run-lab.sh

      - name: JDK migration compiler warnings, jdeprscan and jdeps
        run: bash java/jvm/jdk-upgrade-tooling/run-lab.sh

      - name: FFM String boundary and Virtual Threads resource bulkhead JUnit
        run: |
          mvn --batch-mode --no-transfer-progress \
            -pl java/jvm/native-interoperability,java/concurrency/project-loom/loom-labs \
            -am verify

# JDK28 EA ZGC is *manual opt-in*. Not installed in Java25 CI.
