name: Vlad SQL Labs — PostgreSQL

on:
  pull_request:
    paths:
      - 'database/sql-labs/**'
      - 'pom.xml'
      - '.github/workflows/vlad-sql-labs.yml'
  workflow_dispatch:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # Docker is available on the GitHub-hosted Linux runner.
      # Explicit profile avoids starting PostgreSQL in the root reactor on every push.
      - name: Fast JDBC tests and real PostgreSQL integration tests
        run: mvn --batch-mode --no-transfer-progress -pl database/sql-labs -Ppostgres-integration verify

      - name: Guard against accidentally skipped SQL integration tests
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          expected = [
              (Path('database/sql-labs/target/surefire-reports/TEST-bg.hristomanov.education.sql.H2SqlSemanticsTest.xml'), 6),
              (Path('database/sql-labs/target/failsafe-reports/TEST-bg.hristomanov.education.sql.PostgresNativeSqlIT.xml'), 4),
              (Path('database/sql-labs/target/failsafe-reports/TEST-bg.hristomanov.education.sql.PostgresUpsertLabIT.xml'), 4),
              (Path('database/sql-labs/target/failsafe-reports/TEST-bg.hristomanov.education.sql.PostgresFlywayMigrationIT.xml'), 2),
              (Path('database/sql-labs/target/failsafe-reports/TEST-bg.hristomanov.education.sql.PostgresSqlLabIT.xml'), 8),
          ]
          for report, minimum in expected:
              if not report.is_file():
                  raise SystemExit(f'Missing test report: {report}')
              root = ET.parse(report).getroot()
              tests = int(root.attrib.get('tests', '0'))
              skipped = int(root.attrib.get('skipped', '0'))
              failures = int(root.attrib.get('failures', '0'))
              errors = int(root.attrib.get('errors', '0'))
              print(f'{report.name}: tests={tests} skipped={skipped} failures={failures} errors={errors}')
              if tests < minimum or skipped or failures or errors:
                  raise SystemExit(f'Tests not fully executed: {report}')
          PY
