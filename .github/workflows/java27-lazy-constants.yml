name: Java 27 Lazy Constants Preview

on:
  pull_request:
    paths:
      - 'java/experiments/jdk27-lazy-constants/**'
      - '.github/workflows/java27-lazy-constants.yml'
  workflow_dispatch:

jobs:
  lazy-constant-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 27
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '27'
      - name: Compile and exercise JDK 27 preview semantics
        run: |
          java -version
          LAB="java/experiments/jdk27-lazy-constants"
          mkdir -p "$RUNNER_TEMP/lazy27"
          javac --enable-preview --release 27 -d "$RUNNER_TEMP/lazy27" "$LAB/LazyConstantProbe.java"
          java --enable-preview -cp "$RUNNER_TEMP/lazy27" LazyConstantProbe
