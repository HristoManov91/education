name: Kubernetes Java Lab

on:
  pull_request:
    paths:
      - 'infrastructure/kubernetes/**'
      - 'spring/testing/testcontainers/JAVA-IMAGE-HARDENING.md'
      - 'java/jvm/performance-evolution/JVM-IN-CONTAINERS.md'
      - '.github/workflows/kubernetes-java-lab.yml'
  workflow_dispatch:

jobs:
  java-kind-lab:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Java unit and real HTTP tests
        run: mvn --batch-mode --no-transfer-progress -pl infrastructure/kubernetes verify

      - name: Offline Kubernetes manifest invariants and negative tests
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          python3 infrastructure/kubernetes/scripts/validate_manifests.py
          python3 -m unittest discover -s infrastructure/kubernetes/scripts -p 'test_*.py' -v

      - name: Create disposable Kubernetes kind cluster
        uses: helm/kind-action@v1.14.0
        with:
          cluster_name: education-java

      - name: Build and deploy real Java image to kind
        run: bash infrastructure/kubernetes/scripts/kind-smoke.sh
