name: Quarkus Build Time Education Lab

on:
  pull_request:
    paths:
      - 'spring/framework-internals/quarkus-build-time/**'
      - '.github/workflows/quarkus-build-time-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quarkus-extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Quarkus build-time augmentation and HTTP integration tests
        run: mvn --batch-mode --no-transfer-progress -f spring/framework-internals/quarkus-build-time/pom.xml verify
