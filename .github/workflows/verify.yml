name: Verify

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  maven-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify
        run: mvn --no-transfer-progress verify
