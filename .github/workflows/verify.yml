name: Verify

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  maven-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUN_REDIS_TESTS: "true"

    services:
      redis:
        image: redis:8.10.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify offline SBOM reconciliation
        run: python3 -m unittest discover -s spring/testing/testcontainers/sbom-accuracy -p 'test_*.py'

      - name: Verify
        run: mvn --no-transfer-progress verify

      - name: Validate JMH executable harness
        run: |
          JMH_JAR="java/jvm/performance-evolution-benchmarks/target/benchmarks.jar"
          test -s "$JMH_JAR"
          java --add-modules jdk.incubator.vector -jar "$JMH_JAR" -l | tee "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'ShapeDispatchBenchmark.virtualDispatch' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'ShapeDispatchBenchmark.explicitTypeChecks' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'AllocationReuseBenchmark.allocateFresh' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'AllocationReuseBenchmark.overwriteExisting' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'DotProductBenchmark.vectorMulAdd' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'DotProductBenchmark.vectorFma' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'MapCopyAndRecordHashBenchmark.mapConstructor' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'MapCopyAndRecordHashBenchmark.defaultRecordHash' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'SubwordLoopsBenchmark.narrowInts' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'ConfinedArenaPoolBenchmark.confinedArenaAllocateWriteRead' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'MethodDispatchBenchmark.direct' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'MethodDispatchBenchmark.cachedReflection' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'MethodDispatchBenchmark.cachedMethodHandle' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'FfmLinkageBenchmark.cachedStrlen' "$RUNNER_TEMP/jmh-benchmarks.txt"
          grep -Fq 'FfmLinkageBenchmark.relinkStrlenEveryCall' "$RUNNER_TEMP/jmh-benchmarks.txt"
