name: Delete merged branch

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-merged-branch:
    if: >
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch
    runs-on: ubuntu-latest

    steps:
      - name: Delete merged head branch
        uses: actions/github-script@v7
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;

            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branch}`
              });
              core.info(`Deleted merged branch: ${branch}`);
            } catch (error) {
              // Ако branch-ът вече е изтрит (например ръчно или от GitHub настройка),
              // workflow-ът не трябва да fail-ва.
              if (error.status === 404 || error.status === 422) {
                core.info(`Branch already deleted or unavailable: ${branch}`);
                return;
              }
              throw error;
            }
